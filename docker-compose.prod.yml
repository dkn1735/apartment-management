# Demo: build và chạy cả ba phần bằng một lệnh
#   docker compose -f docker-compose.prod.yml up --build
# Chỉ frontend mở cổng ra ngoài (http://localhost:3000); backend và db nằm trong mạng Docker.
services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chungcu}
      POSTGRES_USER: ${POSTGRES_USER:-chungcu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
    volumes:
      - db-data-prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # seed: tài khoản mẫu cho bản demo trên máy cá nhân (mật khẩu công khai trong repo)
      SPRING_PROFILES_ACTIVE: prod,seed
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-chungcu}
      DB_USERNAME: ${POSTGRES_USER:-chungcu}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      # Trình duyệt chỉ gửi cookie Secure qua https; demo qua http thì đặt false trong .env
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Gửi email đặt lại mật khẩu (spec 0010); bản demo dùng Gmail với App Password
      MAIL_HOST: ${MAIL_HOST:?Thiếu MAIL_HOST trong .env}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Thiếu MAIL_USERNAME trong .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Thiếu MAIL_PASSWORD trong .env}
      MAIL_FROM: ${MAIL_FROM:?Thiếu MAIL_FROM trong .env}
      # Địa chỉ mà máy người dùng mở được, dùng để dựng link trong email
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Thiếu APP_PUBLIC_URL trong .env}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data-prod:
