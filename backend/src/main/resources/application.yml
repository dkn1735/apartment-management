spring:
  application:
    name: chungcu
  config:
    # backend/.env (không commit) cho chạy local; biến môi trường thật vẫn được ưu tiên
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    # Không dùng tài khoản trong bộ nhớ của Spring; tài khoản nằm trong DB (spec Đăng nhập)
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Mỗi dòng nhật ký hoãn tới sau commit cần kết nối thứ hai khi kết nối đầu chưa trả
      # về pool (spec 0007); mặc định chỉ 10
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # Chuỗi ${ trong SQL không phải biến Flyway
    placeholder-replacement: false
    # Thay hẳn mặc định của Flyway, nên phải giữ *:future. repeatable:missing cho phép
    # bỏ profile seed trên database đã seed mà validate không báo thiếu migration.
    ignore-migration-patterns: "*:future,repeatable:missing"
  threads:
    virtual:
      enabled: true
  task:
    execution:
      # Bean emailExecutor (spec 0010) không được làm mất executor mặc định của Spring
      mode: force
  # Gửi email qua SMTP (spec 0010). Máy chủ đặt theo profile: dev là Mailpit, prod bắt buộc
  # MAIL_HOST.
  mail:
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Không mở kết nối SMTP (Gmail) mỗi lần kiểm health; lỗi gửi đã có log riêng
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  # URL gốc của frontend để dựng link trong email; backend không đọc header Host
  public-url: ${APP_PUBLIC_URL:}
  mail:
    from: ${MAIL_FROM:}
  security:
    # Không có giá trị mặc định: thiếu JWT_SECRET thì backend dừng lúc khởi động
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    # Mật khẩu mới và mật khẩu cũ được nâng lên cost này sau lần đăng nhập đúng
    bcrypt-cost: 12
    # Đặt COOKIE_SECURE=false chỉ khi demo qua http trên mạng LAN
    cookie-secure: ${COOKIE_SECURE:true}
    # Làm mới phiên (spec 0005): phiên trượt 7 ngày mỗi lần làm mới, không quá 30 ngày
    # kể từ lần đăng nhập đầu
    session-max-lifetime: P30D
    # Dùng lại token vừa xoay trong khoảng này nhận lại token đang sống, không bị coi
    # là đánh cắp (tab chạy đua, response làm mới bị mất); từ PT1S tới PT60S
    refresh-reuse-grace: PT30S
    # Phải không nhỏ hơn session-max-lifetime
    session-retention: P30D
    session-cleanup-cron: "0 0 3 * * *"
    # Link đặt lại mật khẩu qua email (spec 0010); trang quên mật khẩu ghi cùng số phút
    password-reset-ttl: PT30M
