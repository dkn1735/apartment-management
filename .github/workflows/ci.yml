# CI cho mỗi lần push và PR (AGENTS.md, mục Tooling)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (verify + openapi.json)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Kiểm tra định dạng, build, test với Testcontainers (runner có sẵn Docker),
      # và xuất lại docs/api/openapi.json
      - run: ./mvnw -B verify
      - name: openapi.json phải khớp với code
        run: git diff --exit-code -- ../docs/api/openapi.json

  frontend:
    name: Frontend (lint, format, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Không cài git hook trên máy CI
      LEFTHOOK: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - name: schema.d.ts phải khớp với openapi.json
        run: pnpm gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    name: Docker images (bản demo)
    runs-on: ubuntu-latest
    env:
      # Compose đọc các biến :? ngay cả khi chỉ build; giá trị giả, không image nào chạy
      POSTGRES_PASSWORD: ci-build-only
      JWT_SECRET: ci-build-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      # Build image trong ngữ cảnh không có .git, bắt lỗi như prepare: lefthook install
      - run: docker compose -f docker-compose.prod.yml build
