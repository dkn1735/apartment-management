# Dev: bật PostgreSQL và Mailpit. Backend chạy bằng mvnw.cmd spring-boot:run, frontend bằng pnpm dev.
services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chungcu}
      POSTGRES_USER: ${POSTGRES_USER:-chungcu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 lưu dữ liệu dưới /var/lib/postgresql (không còn /var/lib/postgresql/data)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Hộp thư giả cho dev (spec 0010): backend gửi SMTP tới cổng 1025, xem thư ở
  # http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
